<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Casa Luanda</title>
<meta name="description" content="Plataforma de demonstração para arrendar e comprar casa em Luanda, com anúncios verificados e contacto direto por WhatsApp.">
<meta name="theme-color" content="#0B6B5F">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { color-scheme: light; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout concept: marketplace shell. Sticky top bar on desktop, bottom tab bar on phones.
   Explorar = filter rail + card grid (or schematic map). Detail = gallery + sticky contact card. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --ink: #12201D;
  --muted: #566660;
  --line: #DCE4E1;
  --accent: #0B6B5F;
  --on-accent: #FFFFFF;
  --accent-soft: #DDEEE9;
  --accent-ink: #0A4F46;
  --warn: #8A4305;
  --warn-soft: #FBEBD5;
  --bad: #B3261E;
  --bad-soft: #F9DEDC;
  --sea: #D6E7EE;
  --land: #E6EDE7;
  --shadow: 0 1px 2px rgba(18,32,29,.06), 0 8px 24px rgba(18,32,29,.07);
  --font-display: 'Bricolage Grotesque', 'Manrope', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1513; --surface: #15211E; --ink: #E7F0EC; --muted: #9BB0A9; --line: #24352F;
    --accent: #4CC2AC; --on-accent: #062019; --accent-soft: #193A33; --accent-ink: #8EE0CF;
    --warn: #F0B263; --warn-soft: #3A2A12; --bad: #FF8F86; --bad-soft: #3E1B18;
    --sea: #13262D; --land: #1A2824;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1513; --surface: #15211E; --ink: #E7F0EC; --muted: #9BB0A9; --line: #24352F;
  --accent: #4CC2AC; --on-accent: #062019; --accent-soft: #193A33; --accent-ink: #8EE0CF;
  --warn: #F0B263; --warn-soft: #3A2A12; --bad: #FF8F86; --bad-soft: #3E1B18;
  --sea: #13262D; --land: #1A2824;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; line-height: 1.15; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.brand svg { color: var(--accent); flex-shrink: 0; }
.nav { display: flex; gap: 4px; }
.navlink { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 700; }
.navlink:hover { background: var(--bg); color: var(--ink); }
.navlink[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }
.navlink svg { width: 20px; height: 20px; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; }
.botnav { display: none; }

main { padding-top: 24px; padding-bottom: 64px; }
.foot { border-top: 1px solid var(--line); padding-block: 24px 40px; color: var(--muted); font-size: 13px; }

/* shared bits */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn-danger { color: var(--bad); }
.btn-block { width: 100%; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.tag svg { width: 14px; height: 14px; }
.tag-ok { background: var(--surface); color: var(--accent-ink); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.pill-wait { background: var(--warn-soft); color: var(--warn); }
.pill-ok { background: var(--accent-soft); color: var(--accent-ink); }
.pill-no { background: var(--bad-soft); color: var(--bad); }
.muted { color: var(--muted); }
.lead { color: var(--muted); font-size: 16px; max-width: 60ch; }
.page-head { display: grid; gap: 8px; margin-bottom: 20px; }
.page-head h1 { font-size: clamp(28px, 4.2vw, 40px); }

/* explorar */
.explore { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.filters { position: sticky; top: calc(80px + env(safe-area-inset-top, 0px)); display: grid; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="number"], input[type="tel"], select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
textarea { min-height: 96px; resize: vertical; }
.inwrap { position: relative; }
.inwrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.inwrap input { padding-left: 38px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { flex: 1 1 auto; min-width: 48px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
.more { display: grid; gap: 16px; }
.more-toggle { display: none; }
.linkbtn { background: none; border: 0; padding: 0; min-height: 44px; color: var(--accent); font-weight: 700; text-align: left; text-decoration: underline; }

.res-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.res-head strong { font-family: var(--font-display); font-size: 20px; }
.res-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.res-tools select { width: auto; }
.seg.small button { min-height: 40px; padding: 0 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: box-shadow .15s ease, transform .15s ease; }
.card:hover { box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) { .card:hover { transform: translateY(-2px); } }
.thumb { position: relative; aspect-ratio: 16 / 10; background: var(--accent-soft); }
.thumb > svg { display: block; width: 100%; height: 100%; }
.thumb .tag { position: absolute; top: 10px; left: 10px; }
.thumb .ph { position: absolute; left: 10px; bottom: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; font-weight: 600; }
.fav { position: absolute; top: 4px; right: 4px; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #fff; }
.fav span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); color: var(--accent); }
.fav svg { width: 20px; height: 20px; }
.card-body { display: grid; gap: 4px; padding: 14px 16px 16px; }
.price { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.price small { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--muted); }
.card h3 { font-size: 16px; font-weight: 700; font-family: var(--font-body); letter-spacing: 0; }
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a::after { content: ""; position: absolute; inset: 0; }
.zone { color: var(--accent-ink); font-weight: 700; font-size: 13px; }
.specs { color: var(--muted); font-size: 13px; }
.empty { display: grid; justify-items: start; gap: 12px; padding: 32px 24px; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
.empty h2 { font-size: 22px; }

.mapbox { background: var(--sea); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; max-height: 640px; }
.map-land { fill: var(--land); }
.map-strip { stroke: var(--land); fill: none; stroke-linecap: round; }
.map-zone { fill: var(--muted); font-size: 13px; font-weight: 700; font-family: var(--font-body); }
.map-sea { fill: var(--muted); font-size: 13px; font-style: italic; font-family: var(--font-body); }
.map-dot { fill: var(--muted); opacity: .5; }
.pin { cursor: pointer; }
.pin rect { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.pin text { fill: var(--ink); font-size: 15px; font-weight: 800; font-family: var(--font-body); text-anchor: middle; }
.pin.sel rect { fill: var(--accent); }
.pin.sel text { fill: var(--on-accent); }
.map-note { padding: 8px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--line); }
.map-pick { margin-top: 16px; max-width: 420px; }

/* detalhe */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; text-decoration: none; }
.back svg { width: 18px; height: 18px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "gallery contact" "head contact" "info contact"; gap: 20px 28px; align-items: start; }
.d-gallery { grid-area: gallery; }
.d-head { grid-area: head; display: grid; gap: 6px; }
.d-info { grid-area: info; display: grid; gap: 24px; }
.d-contact { grid-area: contact; position: sticky; top: calc(80px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.d-head .price { font-size: clamp(28px, 4vw, 36px); }
.d-head h1 { font-size: clamp(22px, 3vw, 28px); font-weight: 700; }
.gallery { position: relative; border-radius: 14px; overflow: hidden; background: var(--accent-soft); aspect-ratio: 16 / 10; }
.gallery .slide svg { display: block; width: 100%; height: 100%; }
.g-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.g-btn svg { width: 20px; height: 20px; }
.g-prev { left: 10px; } .g-next { right: 10px; }
.g-dots { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 0; }
.g-dots button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; padding: 0; }
.g-dots button i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.65); border: 1px solid rgba(0,0,0,.25); }
.g-dots button[aria-current="true"] i { background: var(--accent); border-color: var(--surface); width: 11px; height: 11px; }
.gallery .ph { position: absolute; left: 12px; top: 10px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.fact { padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 2px; }
.fact strong { font-family: var(--font-display); font-size: 20px; }
.fact span { font-size: 12px; color: var(--muted); font-weight: 600; }
.d-info h2 { font-size: 18px; margin-bottom: 8px; }
.amen { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
.amen li { padding: 6px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; font-size: 13px; }
.agent { display: flex; align-items: center; gap: 12px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); font-family: var(--font-display); font-weight: 800; flex-shrink: 0; }
.agent strong { display: block; }
.agent span { font-size: 13px; color: var(--accent-ink); font-weight: 700; }
.safe { font-size: 13px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); }
.phone { padding: 10px 12px; border-radius: 10px; background: var(--bg); font-weight: 700; word-break: break-word; }

/* anunciar + equipa */
.two { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.panel h2 { font-size: 20px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.amen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 12px; }
.dropzone { display: grid; place-items: center; gap: 4px; padding: 20px; text-align: center; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 13px; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: s; }
.steps li { position: relative; padding-left: 40px; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 14px; }
.steps strong { display: block; }
.steps span { color: var(--muted); font-size: 14px; }
.ok-box { display: grid; gap: 12px; justify-items: start; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 2px; }
.stat strong { font-family: var(--font-display); font-size: 26px; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 600; }
.queue { display: grid; gap: 16px; }
.q-item { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.q-item .thumb { border-radius: 10px; overflow: hidden; align-self: start; }
.q-body { display: grid; gap: 10px; min-width: 0; }
.q-body h3 { font-size: 17px; font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }
.q-checks { display: grid; gap: 0; }
.q-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.done-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.done-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.sec-title { font-size: 20px; margin: 28px 0 12px; }
.sec-title:first-child { margin-top: 0; }

/* modal + toast */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; background: rgba(8,16,14,.55); padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.overlay[hidden] { display: none; }
.sheet { width: 100%; max-width: 480px; display: grid; gap: 14px; padding: 20px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); max-height: 100%; overflow: auto; }
.sheet h2 { font-size: 20px; }
.sheet textarea { min-height: 120px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
#toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 60; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 899px) {
  .explore { grid-template-columns: minmax(0, 1fr); }
  .filters { position: static; }
  .more-toggle { display: inline-flex; }
  .more { display: none; }
  .filters.open .more { display: grid; }
  .detail { grid-template-columns: minmax(0, 1fr); grid-template-areas: "gallery" "head" "contact" "info"; }
  .d-contact { position: static; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 719px) {
  .nav { display: none; }
  main { padding-top: 16px; padding-bottom: 120px; }
  .botnav { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .botnav .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .botnav .navlink { flex-direction: column; justify-content: center; gap: 2px; min-height: 62px; padding: 6px 4px; font-size: 12px; border-radius: 0; background: transparent; }
  .botnav .navlink[aria-current="page"] { background: transparent; box-shadow: inset 0 3px 0 var(--accent); }
  .botnav .badge { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; font-size: 11px; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .q-item { grid-template-columns: minmax(0, 1fr); }
  .stats { gap: 8px; }
  .stat { padding: 12px; }
  .stat strong { font-size: 22px; }
  #toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#explorar" aria-label="Minha Casa, página inicial">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 15 16 5l12 10v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V15Z" fill="currentColor"/><path d="M12 27v-8a4 4 0 0 1 8 0v8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      Minha Casa
    </a>
    <nav class="nav" id="topnav" aria-label="Principal"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="foot">
  <div class="wrap">Demonstração com dados de exemplo. Os imóveis, preços, fotos e contactos são fictícios e o nome "Minha Casa" é provisório. Os favoritos e os anúncios que criares ficam só neste navegador.</div>
</footer>

<div class="botnav"><nav class="nav" id="botnav" aria-label="Principal"></nav></div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */

    else if (act === 'view') { F.view = v; renderResults(); refocus('[data-act="view"][data-v="' + v + '"]'); }
    else if (act === 'more') { F.open = !F.open; renderFilters(); refocus('[data-act="more"]'); }
    else if (act === 'clear') { F.q = ''; F.zone = ''; F.max = 0; F.beds = 0; F.furn = false; renderFilters(); renderResults(); }
    else if (act === 'pin') { F.sel = id; renderResults(); refocus('.pin[data-id="' + id + '"]'); }
    else if (act === 'slide') { setSlide(slide + (+v)); }
    else if (act === 'dot') { setSlide(+v); }
    else if (act === 'phone') { p = byId(current.arg); $('#phone-slot').innerHTML = '<p class="phone">' + esc(agentOf(p).phone) + '<br><small class="muted">Número de exemplo</small></p>'; }
    else if (act === 'wa') { p = byId(id); if (p) openWa(p); }
    else if (act === 'copy') {
      var ta = $('#wa-msg');
      var fallback = function () { ta.focus(); ta.select(); toast('Seleciona e copia a mensagem.'); };
      try { navigator.clipboard.writeText(ta.value).then(function () { toast('Mensagem copiada.'); }, fallback); } catch (err) { fallback(); }
    }
    else if (act === 'close') { closeSheet(); }
    else if (act === 'another') { submitted = null; render(); window.scrollTo(0, 0); }
    else if (act === 'approve') { p = byId(id); if (p && !t.disabled) { p.status = 'approved'; p.verified = TODAY; save(); render(); toast('Anúncio aprovado. Já aparece em Explorar.'); } }
    else if (act === 'reject') { p = byId(id); if (p) { p.status = 'rejected'; save(); render(); toast('Anúncio rejeitado.'); } }
    else if (act === 'reset') { confirmReset = true; render(); }
    else if (act === 'reset-no') { confirmReset = false; render(); }
    else if (act === 'reset-yes') { S = freshState(); save(); confirmReset = false; F.sel = ''; render(); toast('Demonstração reposta.'); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#overlay').hidden) { closeSheet(); return; }
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.pin')) { e.preventDefault(); F.sel = t.dataset.id; renderResults(); refocus('.pin[data-id="' + F.sel + '"]'); }
  });
  $('#overlay').addEventListener('click', function (e) { if (e.target.id === 'overlay') closeSheet(); });
  document.addEventListener('input', function (e) { if (e.target.id === 'f-q') { F.q = e.target.value; renderResults(); } });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'f-zone') { F.zone = t.value; renderResults(); }
    else if (t.id === 'f-max') { F.max = +t.value; renderResults(); }
    else if (t.id === 'f-furn') { F.furn = t.checked; renderResults(); }
    else if (t.id === 'f-sort') { F.sort = t.value; renderResults(); refocus('#f-sort'); }
    else if (t.dataset && t.dataset.ck) {
      var box = t.closest('.q-item'), cks = $$('[data-ck]', box);
      $('[data-act="approve"]', box).disabled = !cks.every(function (c) { return c.checked; });
    }
  });
  document.addEventListener('submit', function (e) { if (e.target.id === 'ad-form') { e.preventDefault(); submitAd(); } });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
